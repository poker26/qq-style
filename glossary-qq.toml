# Словарь проекта «Учи Кванты!» и Лаборатории (слой 3, GLOSSARY-qq.md).
# Подключается к проверке флагом: check_texts.py --glossary glossary-qq.toml
# Формат тот же, что в rules.toml: id, объяснение, регулярные выражения.

[meta]
project = "qq"

[[ban]]
id = "qq-notebook"
why = "ноутбук по-русски это переносной компьютер; файл Jupyter называется блокнотом"
patterns = ['\bноутбук\w*']

[[ban]]
id = "qq-shots"
why = "одно исполнение схемы называется запуском, серия запусков это прогон; «выстрел» и «шот» не термины"
patterns = ['\bвыстрел\w*', '\bшот(ы|ов|ами|ах|а|у|е)?\b']

[[ban]]
id = "qq-kvant-noun"
why = "«квант» как устройство это жаргон: квантовый компьютер, квантовая схема, квантовый алгоритм"
# только единственное число: «кванты», «квантов» в физике (кванты колебаний, света) законны
patterns = ['\bквант(а|у|ом|е)\b(?! колебан| энерги| света| действия)', '\bквант (времени|мощности)\b']

[[ban]]
id = "qq-campaign"
why = "«кампания» не научное слово: серия работ над задачей называется расчётом"
patterns = ['\bкампани\w*']

[[ban]]
id = "qq-pieces"
why = "«куски задачи» так не говорят: задача делится на части"
patterns = ['\bкус(ок|ки|ков|ка|ке|ком|ками) задач', 'задач\w* на кус(ки|очки)']

[[ban]]
id = "qq-loop"
why = "«петля улучшения» это цикл улучшения: каждый проход обязан давать улучшение"
patterns = ['\bпетл\w*']

[[ban]]
id = "qq-trouble"
why = "«беда» применительно к задаче заказчика не годится: у заказчика задача"
patterns = ['наша беда', 'беда настоящая', 'беда (клиента|заказчика)']

[[ban]]
id = "qq-bars"
why = "полоски, не столбики: «высота полоски», «гистограммы совпадают»"
patterns = ['\bстолбик\w*']

[[ban]]
id = "qq-hadamards"
why = "«адамары» как существительное: гейт Адамара, гейты Адамара"
patterns = ['\bадамар(ы|ов|ами|ах|у)\b']

[[ban]]
id = "qq-you-forms"
why = "обращение на «вы»; ты-глаголы только в авторской серии заголовков лабораторных"
patterns = ['\b(покрути|нажми|присмотрись|приглядись|смотри|убери|бери|закодируй|измеряй|платишь|твой|твоя|твои)\b']

[[ban]]
id = "qq-quotes"
why = "кавычки ёлочки, не компьютерные"
patterns = ['"[А-Яа-яЁё][^"]{1,80}"']

[[ban]]
id = "qq-yo"
why = "буква «ё» пишется"
patterns = ['\b(выдает|дает|ждем|еще|разойдется|идет|найдем|берет|растет|всерьез|черный|зеленый|трехмерн\w*|ее|нее)\b']

[[ban]]
id = "qq-typography"
why = "двойные пробелы и пробел перед двоеточием"
patterns = ['\S  +\S', '\S :']
