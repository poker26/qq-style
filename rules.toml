# Машинная часть канона (RULES.md, слой 1). Читают check_texts.py и build.py.
# Каждое правило: id, раздел RULES.md, список регулярных выражений (без учёта
# регистра), объяснение для отчёта и совет замены. Слой 2 («как объяснять»)
# машиной не проверяется, кроме порога слов на шаг.

[meta]
name = "qq-style"
version = "0.1.0"
language = "ru"

[dash]
# 1.1. Тире как связка. Строка с тире считается нарушением, если не подходит
# ни под одно исключение: диапазон чисел, формула, двойная фамилия, таблица.
allow = [
  '\d\s*[—–]\s*\d',
  '^[^—]*\S–\S[^—]*$',            # короткое тире без пробелов: Дойч–Йожи, Хартри–Фок, десятки–сотни, q0–q2 (и нет длинного тире в строке)
  '[A-Za-zА-Яа-я]\s*[—–]\s*[A-Za-zА-Яа-я]\s*[—–]\s*[A-Za-zА-Яа-я]',  # Хонг — У — Мандел
  'Мах\w*\s*[—–]\s*Цендер',
  'Джейнс\w*\s*[—–]\s*Каммингс',
  '^\s*\|',                       # строки таблиц markdown
  '^\s*[-*]\s+\S.*[—–]\s*$',      # список, где тире стоит в конце строки как перенос мысли (редко)
]

[thresholds]
# 2.2. Шаг объясняется, а не называется: слов живого текста перед кодовой
# ячейкой блокнота. Порог взят с переписанных блокнотов qq-lab.
min_words_per_code_cell = 90

# ─────────────────────────── 1.2. Пустые слова ───────────────────────────

[[ban]]
id = "empty-openers"
section = "1.2"
why = "вводная-пустышка: ничего не сообщает, убирается без замены"
patterns = [
  'важно (отметить|понимать|подчеркнуть|заметить)',
  'стоит (отметить|заметить|подчеркнуть|сказать)',
  'как (мы )?видим',
  'давайте (рассмотрим|разберём|посмотрим|поговорим)',
  'погрузимся в',
  'здесь начинается самое интересное',
  'не секрет, что',
  'в современном мире',
  'в (нашу |современную |цифровую )?эпоху',
  'в условиях (современн|нынешн|растущ)',
  'ни для кого не секрет',
  'как известно',
]

[[ban]]
id = "chat-artifacts"
section = "1.2"
why = "артефакт чата, в тексте для читателя ему не место"
patterns = [
  'отличный вопрос',
  '\bконечно!',
  'рад помочь',
  'надеюсь, (это )?(было )?полезно',
  'я бы (по)?рекомендовал',
]

[[ban]]
id = "formula-conclusions"
section = "1.2"
why = "формульный вывод: либо добавляет новое, либо не нужен"
patterns = [
  '\bтаким образом,',
  'подводя итог',
  '\bв заключение\b',
  'можно сделать вывод',
  'резюмируя',
  'в итоге можно сказать',
]

[[ban]]
id = "inflation"
section = "1.2"
why = "раздувание важности: важность показывается фактом, а не эпитетом"
patterns = [
  'играет (ключевую|важную|решающую|огромную) роль',
  'невозможно переоценить',
  'имеет (огромное|большое|ключевое) значение',
  '\bпереломн',
  'краеугольн',
  'революционн',
  'инновационн',
]

[[ban]]
id = "truisms"
section = "1.2"
why = "трюизм с видом глубины"
patterns = [
  'по своей сути',
  'в конечном (счёте|итоге)',
  'самое (важное|главное) это',
  'первый шаг это',
  'ключ к (успеху|пониманию)',
]

[[ban]]
id = "hedges"
section = "1.2"
why = "модальный хедж: если верно, утверждаем; если нет, не пишем"
patterns = [
  'может стать',
  'способ(ен|на|но|ны) обеспечить',
  'призван\w* (решить|обеспечить|помочь)',
  'позволяет достичь',
  'потенциально может',
]

[[ban]]
id = "cliches"
section = "1.2"
why = "мотивационное клише"
patterns = [
  'раскрыть потенциал',
  'вывести на новый уровень',
  'открывает новые горизонты',
  'комплексный подход',
  'меняет правила игры',
  'на передовой',
  'бесшовн',
]

[[ban]]
id = "contextualizers"
section = "1.2"
why = "контекстуализатор: связка без содержания"
patterns = [
  '\bс учётом (вышесказанного|этого)',
  'принимая во внимание',
  'в связи с этим',
]

# ─────────────────────────── 1.3. Штампы модели ───────────────────────────

[[ban]]
id = "not-just"
section = "1.3"
why = "штамп «не просто X, а Y»: говорится прямо «Y»"
patterns = [
  'не просто \w+, а',
  'не только \w+, но и',
  'это не \w+, это',
  'дело не в \w+, а в',
]

[[ban]]
id = "dannyi"
section = "1.3"
why = "«данный» вместо «этот»"
patterns = [
  '\bданн(ый|ая|ое|ого|ой|ому|ую)\b',   # «данные», «данных», «данным» это данные, их не трогаем
]

[[ban]]
id = "yavlyaetsya"
section = "1.3"
why = "бытовое «является»: «X это Y» или перестроить фразу"
patterns = [
  '\bявля(ется|ются)\b',
]

[[ban]]
id = "false-ranges"
section = "1.3"
why = "ложный диапазон: перечисляется конкретно"
patterns = [
  'от стартапов до корпораций',
  'от новичк\w+ до (профессионал|эксперт)',
  'от \w+ до \w+ и (всего|всех) (остального|остальных)',
]

[[ban]]
id = "rule-of-three"
section = "1.3"
why = "правило трёх ради ритма или триада-отрицание"
patterns = [
  'без воды\. без',
  'просто факты',
  'важн\w+, значительн\w+ и ключев',
]

# ─────────────────────────── 1.4. Канцелярит ───────────────────────────

[[ban]]
id = "bureaucratese"
section = "1.4"
why = "канцелярит: глагол почти всегда лучше"
patterns = [
  '\bосуществлени',
  '\bосуществля',
  '\bвнедрени',
  '\bфункционировани',
  '\bв рамках\b',
  '\bв целях\b',
  '\bпосредством\b',
  '\bв соответствии с\b',
  '\bявляется важным\b',
]

[[ban]]
id = "inanimate-agent"
section = "1.4"
why = "неодушевлённый субъект с глаголом намерения: кто решил, тот и подлежащее"
patterns = [
  '(исследование|статья|отчёт|документ) (подчёркива|показыва|демонстриру|утвержда)',
  '(платформа|система|среда|проект|технология) (обеспечива|позволяет|демонстриру|стремится|призван)',
]

# ─────────────────────────── 1.5. Самомаркировка ───────────────────────────

[[ban]]
id = "self-marking"
section = "1.5"
why = "текст называет себя честным или трезвым: непрошеное заверение читается как сомнение"
patterns = [
  '\bчестн\w*',
  'честности ради',
  '\bтрезв\w*',
  'без воды',
  'объективн\w+ (разбор|оценк|взгляд)',
  'скажу без прикрас',
  'без прикрас',
  'не буду лукавить',
  'положа руку на сердце',
  'реальн\w+ выгод\w+ (против|vs|а не) (реклам|хайп)',
  '\bхайп\w*',
]

# ─────────────────────────── 1.6. Кальки ───────────────────────────

[[ban]]
id = "calques"
section = "1.6"
why = "калька с английского"
patterns = [
  'что касается',
  '\bможно сказать, что',
  '^\s*однако,',
  'инструменты, такие как',
  'кладёт [−-]?1 на',
  'ложится на ветвь',
  'узор знаков',
  'уточните усилия',
  'имеет смысл (рассмотреть|обратить)',
  'делает (это )?возможным',
]

# ─────────────────────────── 1.7. Метафоры ───────────────────────────

[[ban]]
id = "lesson-metaphors"
section = "1.7"
why = "натянутая метафора: заменяется прямой речью"
patterns = [
  '\b(главн\w+ )?геро\w+ (урока|главы|блокнота|этого)',
  '\bприз (урока|главы)',
  '\bсердцевин',
  '\bскелет\w*',
  'алгоритм\w* (боится|страшно|смел|робк|устал)',
  'модель (думает|чует|чувствует)',
  'рынок (чует|чувствует)',
]

# ─────────────────────────── 1.8. Очевидное ───────────────────────────

[[ban]]
id = "obvious"
section = "1.8"
why = "объяснение очевидного: масло масляное"
patterns = [
  'начнём с самого начала',
  'прежде чем перейти к деталям',
  'важно понять общую картину',
  'рассмотрим, как это работает',
  'прогнан\w+ целиком',
  'из живых расчётов',
  'решен\w+ до конца',
  'на этой странице (собраны|представлены|приведены)',
  'кнопка ниже (запускает|открывает)',
  'номер справа это',
]

# ─────────────────────────── 1.9. Кухня наружу ───────────────────────────

[[ban]]
id = "meta-leaks"
section = "1.9"
why = "наша внутренняя кухня: читатель видит предмет, а не процесс его изготовления"
patterns = [
  'источник\w*\s+правды',
  '\bнамеренно\b',
  '\bосознанно\b',
  '\bпо замыслу\b',
  '\bмы (?:не )?(?:заводим|решили|считаем|не хотим|отбросили|переделали)\b',
  '\bинтерактив\w*',
  '\b(без )?вкладок\b',
  '\bредизайн',
  'это была ошибка',
  'нам нужно было',
  'RFC-[A-Z0-9]',
  'шаг \d+ (редизайна|рефакторинга)',
]
